name: Update schedule
on:
  schedule: [{cron: '0 21 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests && python scripts/scrape.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add schedule.json; git diff --cached --quiet || (git commit -m "update schedule" && git push)
