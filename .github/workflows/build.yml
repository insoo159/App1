name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm install
      - name: Write config
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
          REPO: ${{ github.repository }}
        run: node -e "require('fs').writeFileSync('www/config.js','window.CFG='+JSON.stringify({gas:process.env.GAS_URL||'',key:process.env.GAS_KEY||'',url:'https://raw.githubusercontent.com/'+process.env.REPO+'/main/schedule.json'}))"
      - run: node scripts/compat.js
      - run: npx cap add android
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
