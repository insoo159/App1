function vs(){const e=exp().filter(r=>r.date.startsWith(mon)),inc=recs.filter(r=>r.type=='收入'&&r.date.startsWith(mon)),bc={},bl={};
e.forEach(r=>{bc[r.cat]=(bc[r.cat]||0)+r.amt;const g=games.find(x=>x.id==r.gid),k=g?g.league||'其他賽事':'未關聯';bl[k]=(bl[k]||0)+r.amt});
const ms=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)}),vals=ms.map(m=>sum(exp().filter(r=>r.date.startsWith(m)))),mx=Math.max(...vals,1),tot=sum(e);
const bud=cfg.budget?`<div class=card>預算 ${tot}/${cfg.budget}<div style="height:8px;background:var(--b);border-radius:4px"><div style="height:8px;width:${Math.min(100,tot/cfg.budget*100)}%;background:${tot>cfg.budget?'#dc2626':'var(--p)'};border-radius:4px"></div></div></div>`:'';
const rs=recs.filter(r=>r.type=='支出'&&r.gid).map(r=>[r.gid,res(r)]).filter(x=>x[1]),u=[...new Map(rs).values()],W=u.filter(x=>x=='W').length,Lo=u.filter(x=>x=='L').length,T=u.length-W-Lo,war=`<div class=card>🏟 我進場戰績${cfg.team?'（'+esc(cfg.team)+'）':'（請到設定選球隊）'}<br><b>${W}勝 ${Lo}敗 ${T}和</b> 勝率 ${u.length?Math.round(W/u.length*100):0}%</div>`;
const games_n=new Set(e.filter(r=>r.gid).map(r=>r.gid)).size;
return `<input type=month value=${mon} onchange="mon=this.value;render()"><div class=card>支出 <b>$${tot}</b> · 收入 $${sum(inc)} · 結餘 $${sum(inc)-tot}<br><span class=m>進場 ${games_n} 場，平均每場 $${games_n?Math.round(sum(e.filter(r=>r.gid))/games_n):0}</span></div>${bud}${war}<div class=card><b>分類佔比</b>${pie(bc)}</div><div class=card><b>賽事別花費</b>${pie(bl)}</div><div class=card><b>近6月支出</b><div class=bar>${vals.map((v,i)=>`<div>$${v}<i style="height:${v/mx*90}px"></i>${ms[i].slice(5)}月</div>`).join('')}</div></div>`}
function vc(){return `<div class=card>賽程來源網址 (JSON)<input id=cu value="${esc(cfg.url)}">每月預算<input id=cb type=number value=${cfg.budget}>我的球隊(關鍵字 例:兄弟)<input id=ct value="${esc(cfg.team)}">雲端備份 Apps Script 網址<input id=cg value="${esc(cfg.gas)}">備份密碼<input id=ck value="${esc(cfg.key)}"><button onclick=savec()>儲存</button> <button class=g onclick=pull()>☁️ 從雲端還原</button> <button class=g onclick=pushAll()>⬆️ 全部上傳到雲端</button></div><div class=card><button onclick=csv()>複製 CSV 備份</button><br><button class=g onclick="if(confirm('清除全部資料？')){localStorage.clear();location.reload()}">清除全部資料</button></div>`}
function savec(){cfg={url:$v('cu'),budget:+$v('cb'),team:$v('ct'),gas:$v('cg'),key:$v('ck')};S('cfg',cfg);render();notif()}
function csv(){const t=['日期,類型,金額,分類,賽事,備註',...recs.map(r=>[r.date,r.type,r.amt,r.cat,gname(r.gid),r.note].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))].join('\n');navigator.clipboard.writeText(t).then(()=>alert('已複製'))}
let cm=today().slice(0,7),cd=null,ph={};
const DB=()=>new Promise((ok,no)=>{const r=indexedDB.open('fl',2);r.onupgradeneeded=()=>{const d=r.result;['p','o'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>ok(r.result);r.onerror=no});
const N=x=>typeof x=='string'?{t:x}:x,T=x=>typeof x=='string'?x:x.t;
const OS=m=>DB().then(db=>db.transaction('o',m).objectStore('o'));
const putO=(id,b)=>OS('readwrite').then(s=>s.put(b,id)),getO=id=>OS('readonly').then(s=>new Promise(ok=>{const q=s.get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})),delO=id=>OS('readwrite').then(s=>s.delete(id)).catch(()=>{});
const b64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function loadph(){try{const db=await DB();await new Promise(ok=>{const c=db.transaction('p').objectStore('p').openCursor();c.onsuccess=()=>{const x=c.result;if(x){ph[x.key]=x.value.map(N);x.continue()}else ok()};c.onerror=ok})}catch{}render()}
const putph=async(d,a)=>{const db=await DB();db.transaction('p','readwrite').objectStore('p').put(a,d)};
const gq=x=>cfg.gas+'?key='+encodeURIComponent(cfg.key)+x;
const pushph=(d,a)=>cfg.gas&&cfg.key?fetch(cfg.gas,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:cfg.key,date:d,photos:a})}).then(r=>r.json()).then(r=>!r.err).catch(()=>false):Promise.resolve(false);
async function ps(d,a){try{await putph(d,a)}catch{alert('照片儲存失敗')}pushph(d,a)}
async function pullph(){try{const l=await(await fetch(gq('&list=1'))).json();for(const d of l.dates||[]){const r=await(await fetch(gq('&date='+d))).json();if(r.photos&&r.photos.length){ph[d]=r.photos.map(N);await putph(d,r.photos)}}}catch{}}
async function pushAll(){if(!cfg.gas||!cfg.key)return alert('請先填網址與密碼');push();let n=0,bad=0;for(const d in ph){(await pushph(d,ph[d]))?n++:bad++;for(const it of ph[d])if(it.id&&!it.u){(await pushOrig(d,it))?n++:bad++}}alert(`已上傳 ${n} 項`+(bad?`，失敗 ${bad} 項，請在有網路時再按一次`:''))}
const shrink=f=>new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
async function up(inp){const d=cd,a=ph[d]||[];for(const f of [...inp.files].slice(0,5-a.length)){const id='o'+Date.now()+'_'+a.length;a.push({t:await shrink(f),id});await putO(id,f)}ph[d]=a;await ps(d,a);render();for(const it of a)if(it.id&&!it.u)await pushOrig(d,it)}
async function pushOrig(d,it){if(!cfg.gas||!cfg.key||!it.id)return false;try{const b=await getO(it.id);if(!b)return false;const r=await(await fetch(cfg.gas,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:cfg.key,orig:it.id,data:await b64(b)})})).json();if(r.ok){it.u=1;await putph(d,ph[d]);return true}}catch{}return false}
async function view(d,i){const it=ph[d][i],o=document.createElement('div');o.id='ov';o.innerHTML=`<img src="${it.t}"><span>載入原圖…</span>`;o.onclick=e=>{if(e.target.tagName=='IMG')e.target.classList.toggle('z');else o.remove()};document.body.appendChild(o);let src=null;try{const b=it.id&&await getO(it.id);if(b)src=URL.createObjectURL(b);else if(it.id&&cfg.gas){const r=await(await fetch(gq('&orig='+it.id))).json();src=r.data||null}}catch{}const im=o.querySelector('img'),sp=o.querySelector('span');if(src){im.src=src;sp.textContent='原畫質 · 點圖放大/縮小 · 點空白處關閉'}else sp.textContent=it.id?'找不到原圖（可能還沒上傳到雲端）':'舊版縮圖，沒有原圖'}
async function rmp(d,i){const it=ph[d][i];ph[d].splice(i,1);await ps(d,ph[d]);if(it.id){delO(it.id);if(cfg.gas)fetch(cfg.gas,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:cfg.key,del:it.id})}).catch(()=>{})}render()}
const rot=()=>document.querySelectorAll('img[data-d]').forEach(m=>{const a=ph[m.dataset.d]||[];if(a.length>1){m.dataset.i=((+m.dataset.i||0)+1)%a.length;m.src=T(a[m.dataset.i])}});
function vcal(){const [y,mo]=cm.split('-').map(Number),f=new Date(y,mo-1,1).getDay(),n=new Date(y,mo,0).getDate();let c='<div></div>'.repeat(f);
for(let d=1;d<=n;d++){const k=`${cm}-${String(d).padStart(2,'0')}`,a=ph[k]||[];c+=`<div class="cell${k==cd?' sel':''}" onclick="cd='${k}';render()">${a.length?`<img data-d="${k}" src="${T(a[0])}">`:''}<small>${d}</small>${games.some(g=>g.date==k)?'<b class=gd>⚾</b>':''}${recs.some(r=>r.date==k)?'<b class=ex>$</b>':''}</div>`}
return `<input type=month value=${cm} onchange="cm=this.value;cd=null;render()"><div class=cal>${[...'日一二三四五六'].map(x=>`<span>${x}</span>`).join('')}${c}</div>${cd?day(cd):'<p class=m>點日期查看／上傳照片（每天最多 5 張，會在日曆輪播）</p>'}`}
function day(k){const gs=games.filter(g=>g.date==k),a=ph[k]||[],rs=recs.filter(r=>r.date==k&&r.type=='支出');
const qs=(gs.length?gs.map(g=>g.home+' '+g.away):[cfg.team||'中華職棒']).map(s=>{const q=encodeURIComponent(s+' '+k+' 官方 賽後');return `<a href="https://www.google.com/search?tbm=isch&q=${q}" target=_blank>🔎 圖片</a> · <a href="https://www.google.com/search?q=${q}+Facebook+OR+Instagram" target=_blank>球團貼文</a> <span class=m>${esc(s)}</span><br>`}).join('');
return `<div class=card><b>${k}</b>${gs.map(g=>`<br>⚾ ${esc(g.title)}${sc(g)}`).join('')}${rs.length?`<br>💰 支出 $${sum(rs)}`:''}<div class=ph>${a.map((s,i)=>`<div><img src="${T(s)}" onclick="view('${k}',${i})"><button class=g onclick="rmp('${k}',${i})">×</button></div>`).join('')}</div>${a.length<5?'<input type=file accept="image/*" multiple onchange="up(this)">':'<span class=m>已滿 5 張</span>'}<br>${qs}<span class=m>搜尋會開瀏覽器，圖片請自行存下再上傳（轉載請留意版權）</span></div>`}
async function notif(){const N=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!N||!cfg.team)return;try{await N.requestPermissions();const p=await N.getPending();if(p.notifications.length)await N.cancel(p);const now=new Date(),l=games.filter(g=>g.date>=today()&&((g.home||'').includes(cfg.team)||(g.away||'').includes(cfg.team))).sort((a,b)=>a.date<b.date?-1:1).map((g,i)=>({id:i+1,title:g.time?'⚾ 2 小時後開打':'⚾ 今天有比賽',body:g.title+' @'+(g.venue||''),schedule:{at:g.time?new Date(new Date(g.date+'T'+g.time+':00').getTime()-7200000):new Date(g.date+'T10:00:00'),allowWhileIdle:true}})).filter(n=>n.schedule.at>now).slice(0,50);if(l.length)await N.schedule({notifications:l})}catch(e){}}

render();loadph().then(()=>{if(cfg.gas&&!Object.keys(ph).length)pullph().then(render)});notif();setInterval(rot,2500);if(!recs.length&&cfg.gas)pull();sync();
</script></body></html>
